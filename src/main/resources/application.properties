spring.application.name=creche-sementinhas

# Conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/creche
spring.datasource.username=postgres
spring.datasource.password=${DB_SENHA}

# Hibernate só confere se as classes batem com o banco
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: as tabelas já existem, então o V1 conta como aplicado
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1